<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatat Meter Air - Developer Mode</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <meta name="theme-color" content="#0284c7">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <header class="bg-sky-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">💧 Water Meter Dev PWA</h1>
            <span id="connection-status" class="text-xs bg-yellow-500 px-2 py-1 rounded text-white font-semibold">Menghubungkan...</span>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-xl">
        
        <section class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-md font-semibold mb-4 text-gray-700">Catat Angka Meter Baru</h2>
            <form id="meter-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600">ID Pelanggan / Lokasi</label>
                    <input type="text" id="customer-id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-sky-500 focus:border-sky-500" placeholder="Contoh: PEL-001">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Angka Meter (m³)</label>
                    <input type="number" step="0.01" id="meter-value" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-sky-500 focus:border-sky-500" placeholder="Contoh: 125.50">
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium p-2 rounded-md transition duration-200">
                    Kirim Data
                </button>
            </form>
        </section>

        <section class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-md font-semibold mb-4 text-gray-700">Riwayat Pencatatan Realtime</h2>
            <div id="log-container" class="space-y-3 max-h-80 overflow-y-auto">
                <p class="text-sm text-gray-400 text-center">Belum ada data tercatat.</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-200 text-gray-600 text-center p-3 text-xs">
        Developer Module &bull; Firebase Realtime Database Integration
    </footer>

    <script type="module" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker terdaftar:', reg.scope))
                    .catch(err => console.error('Service Worker gagal:', err));
            });
        }
    </script>
</body>
</html>
